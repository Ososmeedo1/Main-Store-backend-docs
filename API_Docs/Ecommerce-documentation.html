rating\n              searching review text\n              Examples:\n                    \n              GET /reviews?page=1&limit=10\n              GET /reviews?productId=123\n              GET /reviews?sort=-reviewRating\n              Simple meaning: this API is used to show customer reviews with filtering and sorting.\n            request:\n              url: '{{url}}/reviews'\n              method: GET\n              headers:\n                - name: token\n                  value: '{{token}}'\n            response:\n              status: 200\n              statusText: OK\n              headers:\n                - name: access-control-allow-origin\n                  value: '*'\n                - name: age\n                  value: '0'\n                - name: cache-control\n                  value: public, max-age=0, must-revalidate\n                - name: content-length\n                  value: '512'\n                - name: content-type\n                  value: application/json; charset=utf-8\n                - name: date\n                  value: Sat, 10 Oct 2026 18:31:02 GMT\n                - name: etag\n                  value: W/\"200-pU9PZvac4f8dYdYGSfBvRL3iT4o\"\n                - name: server\n                  value: Vercel\n                - name: strict-transport-security\n                  value: max-age=63072000; includeSubDomains; preload\n                - name: x-powered-by\n                  value: Express\n                - name: x-vercel-cache\n                  value: MISS\n                - name: x-vercel-id\n                  value: fra1::iad1::w26nh-1791657062015-9f67478d161d\n              body:\n                type: json\n                data: |-\n                  {\n                    \"message\": \"done\",\n                    \"data\": [\n                      {\n                        \"_id\": \"6ac15fd433488f956288a309\",\n                        \"userId\": null,\n                        \"productId\": {\n                          \"title\": \"Hatif Nokhba 5G\"\n                        },\n                        \"reviewRating\": 2,\n                        \"reviewBody\": \"test\",\n                        \"reviewStatus\": \"pending\",\n                        \"createdAt\": \"2026-10-03T20:04:36.359Z\",\n                        \"updatedAt\": \"2026-10-03T20:04:36.359Z\"\n                      },\n                      {\n                        \"_id\": \"6aca84564ff66622d81e090b\",\n                        \"userId\": {\n                          \"email\": \"osama1@gmail.com\"\n                        },\n                        \"productId\": {\n                          \"title\": \"Big Shanta\"\n                        },\n                        \"reviewRating\": 5,\n                        \"reviewBody\": \"Good quality\",\n                        \"reviewStatus\": \"pending\",\n                        \"createdAt\": \"2026-10-10T18:30:46.927Z\",\n                        \"updatedAt\": \"2026-10-10T18:30:46.927Z\"\n                      }\n                    ]\n                  }\n      - info:\n          name: accept or reject review\n          type: http\n          seq: 3\n        http:\n          method: PATCH\n          url: '{{url}}/reviews/action/6aca84564ff66622d81e090b'\n          headers:\n            - name: token\n              value: '{{token}}'\n          body:\n            type: json\n            data: |-\n              {\n                \"action\": \"accepted\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        examples:\n          - name: Accept or reject review\n            description: Moderates a product review submitted by a customer. This endpoint allows an admin to either approve a review to make it publicly visible to other customers, or reject it if it violates guidelines or \"6aca805f26b507a8773ecd91\",\n                      \"reviewRating\": 5,\n                      \"reviewBody\": \"Good quality\",\n                      \"reviewStatus\": \"accepted\",\n                      \"createdAt\": \"2026-10-10T18:30:46.927Z\",\n                      \"updatedAt\": \"2026-10-10T18:31:36.930Z\"\n                    }\n                  }\ndocs:\n  content: |+\n    # E-Commerce Backend - Complete Project Documentation\n\n    ## \uD83D\uDCDA Table of Contents\n    1. [Project Overview](#project-overview)\n    2. [Project Structure](#project-structure)\n    3. [Core Features](#core-features)\n    4. [How Everything Works](#how-everything-works)\n    5. [Controllers Guide](#controllers-guide)\n    6. [Database Models](#database-models)\n    7. [Security & Middleware](#security--middleware)\n    8. [Utilities & Helpers](#utilities--helpers)\n\n    ---\n\n    # Project Overview\n\n    ## What is This Project?\n\n    This is the **backend** (server-side) code for an **e-commerce website**. Think of it like the \"brain\" of an online shopping store. While customers see a website or mobile app (the frontend), this backend does all the important work behind the scenes:\n\n    - Managing products and categories\n    - Handling customer orders\n    - Processing payments and discounts\n    - Managing user accounts\n    - Storing and retrieving product reviews\n    - Managing shopping carts\n    - And much more!\n\n    ## Key Technologies Used\n\n    - **Node.js** - JavaScript runtime to run server code\n    - **Express.js** - Framework to handle HTTP requests\n    - **MongoDB** - Database to store all data\n    - **ImageKit** - Cloud service to store product images\n    - **JWT** - Security tokens for user authentication\n    - **Multer** - Tool for handling file uploads\n\n    ---\n\n    # Project Structure\n\n    Let me break down where everything is located:\n\n    ```\n    ecommerce-backend/\n    \u2502\n    \u251C\u2500\u2500 bootstrap.js          \u2190 Starts the application\n    \u251C\u2500\u2500 index.js              \u2190 Main entry point\n    \u251C\u2500\u2500 router-handler.js     \u2190 Routes all API requests to correct controller\n    \u251C\u2500\u2500 package.json          \u2190 List of libraries/dependencies used\n    \u251C\u2500\u2500 vercel.json           \u2190 Deployment configuration\n    \u2502\n    \u251C\u2500\u2500 DB/                   \u2190 Database related files\n    \u2502   \u251C\u2500\u2500 connection.js     \u2190 Connects to MongoDB database\n    \u2502   \u251C\u2500\u2500 global-setup.js   \u2190 Sets up database on startup\n    \u2502   \u2514\u2500\u2500 Models/           \u2190 Database table definitions\n    \u2502       \u251C\u2500\u2500 user.model.js\n    \u2502       \u251C\u2500\u2500 product.model.js\n    \u2502       \u251C\u2500\u2500 category.model.js\n    \u2502       \u251C\u2500\u2500 brand.model.js\n    \u2502       \u251C\u2500\u2500 cart.model.js\n    \u2502       \u251C\u2500\u2500 order.model.js\n    \u2502       \u251C\u2500\u2500 coupon.model.js\n    \u2502       \u251C\u2500\u2500 review.model.js\n    \u2502       \u251C\u2500\u2500 address.model.js\n    \u2502       \u251C\u2500\u2500 sub-category.model.js\n    \u2502       \u2514\u2500\u2500 index.js      \u2190 Exports all models\n    \u2502\n    \u2514\u2500\u2500 src/                  \u2190 Main application code\n        \u251C\u2500\u2500 Middlewares/      \u2190 Security checks and filters\n        \u2502   \u251C\u2500\u2500 auth.middleware.js       \u2190 Checks if user is logged in\n        \u2502   \u251C\u2500\u2500 error-handle.middleware.js \u2190 Handles errors\n        \u2502   \u251C\u2500\u2500 multer.middleware.js     \u2190 Handles file uploads\n        \u2502   \u251C\u2500\u2500 search.middleware.js     \u2190 Helps search products\n        \u2502   \u251C\u2500\u2500 validation.middleware.js \u2190 Checks input data\n        \u2502   \u2514\u2500\u2500 index.js\n        \u2502\n        \u251C\u2500\u2500 Modules/          \u2190 Features grouped by functionality\n        \u2502   \u251C\u2500\u2500 Users/        \u2190 User accounts and authentication\n        \u2502   \u251C\u2500\u2500 Products/     \u2190 Product management\n        \u2502   \u251C\u2500\u2500 Categories/   \u2190 Product categories\n        \u2502   \u251C\u2500\u2500 Sub-Categories/ \u2190 Sub-categories\n        \u2502   \u251C\u2500\u2500 Brands/       \u2190 Product brands\n        \u2502   \u251C\u2500\u2500 Cart/         \u2190 Shopping cart\n        \u2502   \u251C\u2500\u2500 Orders/       \u2190 Customer orders\n        \u2502   \u251C\u2500\u2500 Coupons/      \u2190 Discount codes\n        \u2502   \u251C\u2500\u2500 Reviews/      \u2190 Product reviews\n        \u2502   \u251C\u2500\u2500 Addresses/    \u2190 Delivery addresses\n        \u2502   \u2514\u2500\u2500 index.js\n        \u2502\n        \u2514\u2500\u2500 Utils/            \u2190 Helper functions used everywhere\n            \u251C\u2500\u2500 api-features.utils.js   \u2190 Pagination, filtering, sorting\n            \u251C\u2500\u2500 calculate-price.utils.js \u2190 Calculates product price\n            \u251C\u2500\u2500 crons.utils.js          \u2190 Scheduled tasks\n            \u251C\u2500\u2500 enum.utils.js           \u2190 Constants and enums\n            \u251C\u2500\u2500 error-class.utils.js    \u2190 Custom error handling\n            \u251C\u2500\u2500 file-extensions.utils.js \u2190 Validates file types\n            \u251C\u2500\u2500 general-rules.utils.js  \u2190 Common validation rules\n            \u251C\u2500\u2500 imagekit.utils.js       \u2190 Image upload to cloud\n            \u251C\u2500\u2500 joi-messages.utils.js   \u2190 Error messages\n            \u251C\u2500\u2500 qr-code.utils.js        \u2190 QR code generation\n            \u2514\u2500\u2500 index.js                \u2190 Exports all utilities\n    ```\n\n    ---\n\n    # Core Features\n\n    ## 1. \uD83C\uDFEA Product Management\n\n    Products are the items for sale in the store. A product has:\n    - **Name** (title)\n    - **Description** (what it does)\n    - **Price** (cost)\n    - **Discount** (reduced price)\n    - **Images** (pictures of the product)\n    - **Specifications** (details like size, color, material)\n    - **Stock** (how many are available)\n    - **Category** (which main group it belongs to)\n    - **Sub-Category** (which sub-group it belongs to)\n    - **Brand** (which company makes it)\n\n    ## 2. \uD83D\uDCC2 Organization System\n\n    Products are organized in a hierarchy:\n\n    ```\n    Category (Electronics)\n    \u2514\u2500\u2500 Sub-Category (Smartphones)\n        \u2514\u2500\u2500 Brand (Apple)\n            \u2514\u2500\u2500 Products (iPhone 15 Pro, iPhone 15, etc.)\n    ```\n\n    This helps customers find products easily by browsing through categories.\n\n    ## 3. \uD83D\uDED2 Shopping Cart\n\n    Customers can:\n    - Add products to their cart\n    - Remove products\n    - Change quantity\n    - View total price with discounts applied\n\n    ## 4. \uD83D\uDCE6 Orders\n\n    When customers checkout:\n    - An order is created with all product details\n    - Customer delivery address is saved\n    - Order status is tracked (Pending \u2192 Processing \u2192 Shipped \u2192 Delivered)\n    - All prices are calculated including discounts\n\n    ## 5. \uD83D\uDCB0 Coupons (Discount Codes)\n\n    Admin can create discount codes like \"SAVE50\" that:\n    - Give fixed amount off (e.g., $50 off)\n    - Give percentage off (e.g., 25% off)\n    - Work only for specific users\n    - Have start and end dates\n\n    ## 6. \u2B50 Reviews\n\n    Customers can:\n    - Write reviews about products they bought\n    - Rate products (1-5 stars)\n    - Add comments about the product\n\n    Admins can:\n    - Approve reviews (make them public)\n    - Reject reviews (hide them)\n\n    ## 7. \uD83D\uDD10 User Accounts\n\n    System manages:\n    - User registration (creating new accounts)\n    - User login (checking credentials)\n    - User information (name, email, phone)\n    - User addresses (for delivery)\n\n    ---\n\n    # How Everything Works\n\n    ## \uD83D\uDCE1 Request-Response Flow\n\n    When a customer wants to buy something, here's what happens:\n\n    ```\n    1. Customer clicks \"Add to Cart\" on website\n       \u2193\n    2. Website sends request to this backend server\n       \u2193\n    3. Middleware checks:\n       - Is user logged in?\n       - Is data format correct?\n       - Is user authorized?\n       \u2193\n    4. Controller (code for that feature) processes the request\n       - Add product to database\n       - Calculate new cart total\n       \u2193\n    5. Database stores the information\n       \u2193\n    6. Server sends response back to website\n       \u2193\n    7. Website shows \"Product added to cart!\" message\n    ```\n\n    ## \uD83D\uDD0C How Modules Work\n\n    Each feature (like Products, Orders, Cart) is organized as a Module with:\n\n    ```\n    Module (e.g., Products/)\n    \u251C\u2500\u2500 products.controller.js    \u2190 The actual business logic\n    \u2502   \u251C\u2500\u2500 addProduct()         \u2190 Creates a new product\n    \u2502   \u251C\u2500\u2500 updateProduct()      \u2190 Changes product info\n    \u2502   \u251C\u2500\u2500 deleteProduct()      \u2190 Removes a product\n    \u2502   \u2514\u2500\u2500 listProducts()       \u2190 Shows all products\n    \u2502\n    \u251C\u2500\u2500 products.routes.js       \u2190 URL endpoints\n    \u2502   \u251C\u2500\u2500 POST /products/add\n    \u2502   \u251C\u2500\u2500 PUT /products/:id\n    \u2502   \u251C\u2500\u2500 DELETE /products/:id\n    \u2502   \u2514\u2500\u2500 GET /products\n    \u2502\n    \u251C\u2500\u2500 products.schema.js       \u2190 Validation rules\n    \u2502   \u2514\u2500\u2500 Checks data format before processing\n    \u2502\n    \u2514\u2500\u2500 Utils/                   \u2190 Helper files specific to this module\n        \u2514\u2500\u2500 (if needed)\n    ```\n\n    ## \uD83D\uDD12 Security Layers\n\n    The system has multiple security checks:\n\n    ```\n    Request comes in\n       \u2193\n    1. Multer Middleware\n       \u2514\u2500 Checks if file uploads are valid\n       \u2193\n    2. Validation Middleware\n       \u2514\u2500 Checks if data format is correct\n       \u2193\n    3. Auth Middleware\n       \u2514\u2500 Checks if user is logged in (JWT token)\n       \u2193\n    4. Controller Logic\n       \u2514\u2500 Does the actual work with database\n       \u2193\n    5. Error Handler Middleware\n       \u2514\u2500 If anything goes wrong, sends proper error message\n    ```\n\n    ---\n\n    # Controllers Guide\n\n    A **Controller** is a file containing the actual logic/code that does the work. Here's what each main controller does:\n\n    ## Users Module\n\n    ### registerUser\n    Creates a new customer account. Gets the user's name, email, and password. The password is encrypted (scrambled) for security before storing in the database.\n\n    ### loginUser\n    Checks if the email and password match an existing account. If correct, creates a security token (JWT) that the user sends with every request to prove they're logged in.\n\n    ### updateUserProfile\n    Lets users change their information like name, phone number, email address. Only the logged-in user can update their own profile.\n\n    ### getUserProfile\n    Returns the current logged-in user's information from the database.\n\n    ---\n\n    ## Products Module\n\n    ### addProduct\n    Admin creates a new product by providing:\n    - Product name\n    - Description\n    - Price and discount information\n    - Multiple product images\n    - Specifications (color, size, etc.)\n    - Stock quantity\n    - Which brand and category it belongs to\n\n    Images are uploaded to cloud storage (ImageKit). The final price is automatically calculated after applying discounts.\n\n    ### updateProduct\n    Admin can change any product information:\n    - Name\n    - Description\n    - Price\n    - Discount amount\n    - Stock quantity\n    - Specifications\n    - Product badges (like \"New\" or \"Hot Sale\")\n\n    The system automatically recalculates the final price if price or discount changes.\n\n    ### deleteProduct\n    Admin removes a product completely. All images are deleted from cloud storage too.\n\n    ### listProducts\n    Shows all products with options to:\n    - Filter by category, brand, price range\n    - Sort by price, rating, newest\n    - Search by product name\n    - Paginate through results (show 10 per page)\n\n    ### getSpecificProduct\n    Returns detailed information about one specific product, including all images, specifications, price, and discount details.\n\n    ---\n\n    ## Categories Module\n\n    ### addCategory\n    Admin creates a main product category like \"Electronics\", \"Clothing\", \"Books\". \n    - Needs a unique name\n    - Needs an image to represent the category\n    - System automatically creates a slug (URL-friendly name)\n    - Image stored on cloud\n\n    ### updateCategory\n    Admin changes the category name or image. The slug updates automatically if the name changes.\n\n    ### deleteCategory\n    Removes a category completely. Images deleted from cloud storage.\n\n    ### listCategories\n    Shows all categories with pagination, filtering, and sorting options.\n\n    ### getCategory\n    Returns details of one specific category.\n\n    ---\n\n    ## Sub-Categories Module\n\n    ### addSubCategory\n    Creates a sub-category under a parent category:\n    - Example: \"Smartphones\" under \"Electronics\"\n    - Needs unique name and image\n    - Must belong to an existing category\n    - Images stored in nested folder structure\n\n    ### updateSubCategory\n    Changes the sub-category name or image.\n\n    ### deleteSubCategory\n    Removes sub-category. **Important:** All brands under this sub-category are automatically deleted too (cascading delete).\n\n    ### listSubCategories\n    Shows all sub-categories with filtering and pagination.\n\n    ### getSubCategory\n    Returns details of one specific sub-category.\n\n    ### getAllRelatedBrands\n    Shows all brands that belong to a specific sub-category or category.\n\n    ---\n\n    ## Brands Module\n\n    ### addBrand\n    Admin creates a brand (company) like \"Apple\", \"Samsung\":\n    - Must have unique name\n    - Belongs to a sub-category (which belongs to a category)\n    - Needs a logo image\n    - System verifies the sub-category exists under correct category\n\n    ### updateBrand\n    Changes brand name or logo. Slug regenerates if name changes.\n\n    ### deleteBrand\n    Removes brand completely. Logo and folder deleted from cloud.\n\n    ### getAllBrands\n    Lists all brands with pagination and search.\n\n    ### getBrand\n    Returns details of one specific brand.\n\n    ### getAllRelatedBrands\n    Shows brands that belong to a specific category or sub-category.\n\n    ---\n\n    ## Cart Module\n\n    ### addToCart\n    Adds a product to the customer's shopping cart:\n    - Checks product exists\n    - Checks stock is available\n    - Adds to cart with quantity\n    - Calculates cart total\n\n    ### updateCartItem\n    Changes the quantity of a product in the cart:\n    - Increases or decreases quantity\n    - Validates new quantity doesn't exceed stock\n    - Recalculates cart total\n\n    ### removeFromCart\n    Deletes a product from the shopping cart completely.\n\n    ### getCart\n    Shows everything in the customer's cart:\n    - All products with quantities\n    - Prices per item\n    - Total price before and after discounts\n\n    ### clearCart\n    Empties the entire shopping cart (deletes all items).\n\n    ---\n\n    ## Orders Module\n\n    ### createOrder\n    Customer completes their purchase:\n    - Checks cart has items\n    - Verifies all products still in stock\n    - Creates order with all product details\n    - Saves delivery address\n    - Calculates final price with all discounts\n    - Updates product stock (reduces available quantity)\n    - Clears customer's cart\n\n    ### updateOrderStatus\n    Admin changes the order status through different stages:\n    - Pending (new order, waiting to process)\n    - Processing (preparing items for shipment)\n    - Shipped (package sent to customer)\n    - Delivered (customer received the package)\n    - Cancelled (order cancelled)\n\n    ### listOrders\n    Admin can see all orders with options to:\n    - Filter by status, date, customer\n    - Sort by date, price\n    - Paginate through results\n\n    ### getUserOrders\n    Customer sees only their own orders with details like:\n    - Order number\n    - Order date\n    - Products ordered\n    - Total price\n    - Current status\n\n    ### getOrderById\n    Returns detailed information about one specific order.\n\n    ### cancelOrder\n    Customer can cancel their order (if not already shipped).\n\n    ---\n\n    ## Coupons Module\n\n    ### addCoupon\n    Admin creates a discount coupon code:\n    - Unique code like \"SAVE50\" or \"SUMMER2025\"\n    - Validity period (start and end dates)\n    - Discount amount (fixed or percentage)\n    - Which users can use it\n    - Whether it's enabled or disabled\n\n    ### updateCoupon\n    Admin can modify coupon details:\n    - Change the discount amount\n    - Extend or reduce validity dates\n    - Add or remove eligible users\n    - Enable/disable the coupon\n\n    All changes are logged for audit purposes (tracks who changed what and when).\n\n    ### getCoupons\n    Admin sees all coupons with filtering and pagination.\n\n    ### getCouponById\n    Admin sees details of one specific coupon.\n\n    ---\n\n    ## Reviews Module\n\n    ### addReview\n    Customer writes a review for a product they purchased:\n    - Rate product 1-5 stars\n    - Write review comments\n    - System checks:\n      - User already didn't review this product\n      - Product exists\n      - User actually bought this product\n\n    ### listReviews\n    Shows all reviews (for admin moderation).\n\n    ### approveOrRejectReview\n    Admin decides whether to make a review public or hide it:\n    - **Approve (Accept):** Makes the review visible to other customers on the product page\n    - **Reject:** Hides the review from public view\n\n    This is called \"moderation\" - filtering out inappropriate or fake reviews.\n\n    ---\n\n    ## Addresses Module\n\n    ### addAddress\n    Customer saves a delivery address:\n    - Full name\n    - Street address\n    - City\n    - State/Province\n    - Postal code\n    - Country\n    - Phone number\n\n    Customers can have multiple saved addresses for different delivery locations.\n\n    ### updateAddress\n    Customer changes details of a saved address.\n\n    ### deleteAddress\n    Customer removes a saved address.\n\n    ### listAddresses\n    Shows all saved addresses for the logged-in customer.\n\n    ### getAddress\n    Shows details of one specific address.\n\n    ---\n\n    # Database Models\n\n    A **Model** is like a table structure in the database. It defines what information can be stored. Here's what's stored about each thing:\n\n    ## User Model\n    - Name\n    - Email\n    - Password (encrypted)\n    - Phone number\n    - Profile image\n    - Account creation date\n    - Last login date\n    - Role (customer or admin)\n\n    ## Product Model\n    - Title\n    - Description\n    - Overview\n    - Specifications (JSON object with details)\n    - Price (original price)\n    - Applied discount (amount and type)\n    - Applied price (final price after discount)\n    - Stock quantity\n    - Images (array of image URLs)\n    - Category ID (which category it belongs to)\n    - Sub-Category ID\n    - Brand ID\n    - Creation and update dates\n\n    ## Category Model\n    - Name\n    - Slug (URL-friendly name)\n    - Image (URL and file path)\n    - Custom ID (for folder organization)\n    - Added by (which admin created it)\n    - Creation date\n\n    ## Sub-Category Model\n    - Name\n    - Slug\n    - Image\n    - Category ID (parent category)\n    - Custom ID\n    - Creation date\n\n    ## Brand Model\n    - Name\n    - Slug\n    - Logo image\n    - Category ID\n    - Sub-Category ID\n    - Custom ID\n    - Creation date\n\n    ## Cart Model\n    - User ID (which customer)\n    - Items array:\n      - Product ID\n      - Quantity\n      - Price at time of adding\n    - Total price\n    - Cart created/updated date\n\n    ## Order Model\n    - User ID (customer who placed order)\n    - Products array:\n      - Product ID\n      - Quantity ordered\n      - Price per item\n      - Total for this product\n    - Delivery address\n    - Order status\n    - Order total price\n    - Order date\n    - Expected delivery date\n    - Payment information\n\n    ## Coupon Model\n    - Coupon code\n    - Discount amount\n    - Discount type (fixed or percentage)\n    - Valid from date\n    - Valid until date\n    - List of eligible users\n    - Is enabled (true/false)\n    - Created by (which admin)\n    - Change logs (tracks all updates)\n\n    ## Review Model\n    - User ID (who wrote the review)\n    - Product ID (which product)\n    - Rating (1-5 stars)\n    - Review text/body\n    - Review status (Pending, Accepted, or Rejected)\n    - Creation date\n\n    ## Address Model\n    - User ID (which customer)\n    - Full name\n    - Street address\n    - City\n    - State\n    - Postal code\n    - Country\n    - Phone number\n    - Is primary address (default for checkout)\n\n    ---\n\n    # Security & Middleware\n\n    ## What is Middleware?\n\n    **Middleware** is code that runs **before** the actual controller logic. Think of it like a security checkpoint:\n\n    ```\n    Request \u2192 Checkpoint 1 \u2192 Checkpoint 2 \u2192 Checkpoint 3 \u2192 Controller Logic \u2192 Response\n    ```\n\n    ## The Middleware Files Explained\n\n    ### auth.middleware.js\n    **What it does:** Checks if the user is logged in.\n\n    **How it works:**\n    1. Checks if request has a JWT token (security token)\n    2. Decodes the token to verify it's valid\n    3. Extracts user ID from token\n    4. Attaches user information to the request\n    5. Allows request to proceed only if token is valid\n\n    **Real example:**\n    ```\n    User logs in \u2192 Gets security token \u2192 Sends token with every request\n    Middleware checks \u2192 \"Token valid! This is user #123\"\n    Controller proceeds \u2192 Uses user #123's information\n    ```\n\n    ### validation.middleware.js\n    **What it does:** Checks if the data sent to the server is in the correct format.\n\n    **How it works:**\n    1. Checks required fields are present\n    2. Validates email format (looks like: user@example.com)\n    3. Validates phone number format\n    4. Checks password is strong enough\n    5. Rejects request if any validation fails\n\n    ### multer.middleware.js\n    **What it does:** Handles file uploads (images, documents).\n\n    **How it works:**\n    1. Checks if the file uploaded is the correct type (jpg, png, etc.)\n    2. Limits file size (can't upload huge files)\n    3. Saves file temporarily on server\n    4. Passes file information to controller\n\n    ### error-handle.middleware.js\n    **What it does:** Catches errors and sends proper error messages back to the client.\n\n    **How it works:**\n    1. If anything goes wrong in the controller, catches the error\n    2. Formats error into readable message\n    3. Sends appropriate status code (400, 404, 500, etc.)\n    4. Logs error for debugging\n\n    ### search.middleware.js\n    **What it does:** Helps optimize searches in the database.\n\n    **How it works:**\n    1. Takes search keywords\n    2. Converts to searchable format\n    3. Sets up database query for fast searching\n\n    ---\n\n    # Utilities & Helpers\n\n    ## What are Utilities?\n\n    **Utilities** are helper functions that are used in many places. Instead of writing the same code multiple times, utilities centralize common tasks.\n\n    ## Key Utilities Explained\n\n    ### api-features.utils.js\n    Handles common API features like:\n    - **Pagination:** Shows products 10 per page (shows page 1, 2, 3, etc.)\n    - **Filtering:** Filter products by price range, category, brand\n    - **Sorting:** Sort by price (low to high), newest first, best rated\n    - **Searching:** Search by product name\n    - **Field selection:** Choose which fields to display\n\n    **Example:**\n    ```\n    GET /products?page=2&sort=-price&category=Electronics\n    Shows page 2, sorted by highest price first, only Electronics category\n    ```\n\n    ### calculate-price.utils.js\n    Automatically calculates the final price after discounts:\n    ```\n    Original Price: $100\n    Discount Type: percentage\n    Discount Amount: 20%\n    Final Price: $100 - (100 \xD7 0.20) = $80\n    ```\n\n    ### error-class.utils.js\n    Custom error handling class that creates consistent error messages:\n    ```\n    throw new ErrorHandlerClass(\"Product not found\", 404)\n    Response: { message: \"Product not found\" } with status 404\n    ```\n\n    ### imagekit.utils.js\n    Handles uploading images to cloud storage (ImageKit):\n    - Uploads images when products, categories, brands are created\n    - Replaces old images when updated\n    - Deletes images when items are deleted\n    - Organizes images in folder structure\n\n    ### joi-messages.utils.js\n    Provides standard error messages for validation failures:\n    ```\n    \"Email is required\"\n    \"Password must be at least 8 characters\"\n    \"Phone number must be valid\"\n    ```\n\n    ### enum.utils.js\n    Stores constant values used throughout the app:\n    ```\n    OrderStatus = {\n      Pending: \"Pending\",\n      Processing: \"Processing\",\n      Shipped: \"Shipped\",\n      Delivered: \"Delivered\",\n      Cancelled: \"Cancelled\"\n    }\n    ```\n\n    ### qr-code.utils.js\n    Generates QR codes (those square barcodes):\n    - Generates QR code for orders\n    - Can be scanned by customers to track status\n\n    ### crons.utils.js\n    Runs scheduled tasks automatically (like a timer):\n    - Delete expired coupons\n    - Mark old orders as completed\n    - Send reminder emails\n\n    ---\n\n    # How To Use The APIs - Quick Guide\n\n    ## What is an API?\n\n    An **API** is like a restaurant menu. You:\n    1. Pick what you want (choose an endpoint)\n    2. Tell them how you want it (send data)\n    3. They give you the result (get response)\n\n    ## Making Requests\n\n    ### What You Need\n\n    1. **URL:** Where to send the request\n       ```\n       http://localhost:5000/products/add\n       ```\n\n    2. **HTTP Method:** What action to do\n       - GET: Get/retrieve data\n       - POST: Create new data\n       - PUT: Update existing data\n       - DELETE: Remove data\n\n    3. **Data:** What information to send\n       ```json\n       {\n         \"name\": \"iPhone\",\n         \"price\": 999\n       }\n       ```\n\n    4. **Token:** Proof you're logged in\n       ```\n       Authorization: Bearer your_token_here\n       ```\n\n    ## Example Workflow: Buying a Product\n\n    ### Step 1: User Logs In\n    ```\n    POST /users/login\n    Send: { email: \"user@example.com\", password: \"password123\" }\n    Get back: { token: \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\" }\n    ```\n\n    ### Step 2: Browse Products\n    ```\n    GET /products?category=Electronics\n    Send: Authorization header with token\n    Get back: List of electronics products\n    ```\n\n    ### Step 3: Add to Cart\n    ```\n    POST /cart/add\n    Send: { productId: \"123\", quantity: 1 }\n    Get back: { message: \"Product added to cart\" }\n    ```\n\n    ### Step 4: View Cart\n    ```\n    GET /cart\n    Send: Authorization header with token\n    Get back: All items in cart with total price\n    ```\n\n    ### Step 5: Create Order\n    ```\n    POST /orders/create\n    Send: { cartItems: [...], deliveryAddressId: \"456\" }\n    Get back: Order confirmation with order number\n    ```\n\n    ### Step 6: Check Order Status\n    ```\n    GET /orders/507f1f77bcf86cd799439011\n    Send: Authorization header with token\n    Get back: Order details with current status\n    ```\n\n    ---\n\n    # Common Concepts Explained\n\n    ## Status Codes\n\n    When you make a request, you get a status code:\n\n    | Code | Meaning | What Happened |\n    |------|---------|---------------|\n    | 200 | OK | Request succeeded \u2705 |\n    | 201 | Created | New item created successfully \u2705 |\n    | 400 | Bad Request | Data you sent was wrong \u274C |\n    | 401 | Unauthorized | You're not logged in \u274C |\n    | 404 | Not Found | Item doesn't exist \u274C |\n    | 500 | Server Error | Server had a problem \u274C |\n\n    ## JSON Format\n\n    Data is sent in **JSON** format (JavaScript Object Notation):\n    ```json\n    {\n      \"name\": \"iPhone 15\",\n      \"price\": 999,\n      \"inStock\": true,\n      \"colors\": [\"Black\", \"Silver\", \"Gold\"],\n      \"specs\": {\n        \"storage\": \"256GB\",\n        \"ram\": \"8GB\"\n      }\n    }\n    ```\n\n    ## Slug\n\n    A **slug** is a URL-friendly version of text:\n    ```\n    Original: \"iPhone 15 Pro Max\"\n    Slug:     \"iphone-15-pro-max\"\n\n    Used in URL: /products/iphone-15-pro-max\n    ```\n\n    ## JWT Token\n\n    A **JWT Token** is a security token that proves you're logged in:\n    ```\n    User logs in \u2192 Server gives token\n    Token looks like: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\n    User sends token with every request\n    Server checks token \u2192 Allows request if valid\n    ```\n\n    ## Cascading Delete\n\n    When you delete something, related items are also deleted:\n    ```\n    Delete Sub-Category \u2192 All Brands under it deleted\n    Delete Brand \u2192 Could affect Products\n    ```\n\n    ---\n\n    # Key Takeaways\n\n    ## This Backend System:\n\n    \u2705 **Manages an entire e-commerce store** with products, categories, brands\n    \u2705 **Handles customer accounts** with authentication and security\n    \u2705 **Processes orders** from creation to delivery\n    \u2705 **Manages shopping carts** with real-time calculations\n    \u2705 **Applies discounts** using coupon codes\n    \u2705 **Stores reviews** with moderation system\n    \u2705 **Uploads images** to cloud storage automatically\n    \u2705 **Validates all data** before processing\n    \u2705 **Logs all changes** for audit purposes\n    \u2705 **Provides API endpoints** for frontend to use\n\n    ## For Developers:\n\n    - **Controllers** contain the business logic\n    - **Models** define database structure\n    - **Middleware** provides security checks\n    - **Utilities** contain reusable helper functions\n    - **Routes** define all API endpoints\n    - **Schemas** validate incoming data\n\n    ## For API Users:\n\n    - Always send **authentication token** (JWT)\n    - Follow the correct **request format**\n    - Check **status codes** for success/failure\n    - Handle **error messages** gracefully\n    - Use **pagination** for large result sets\n\n    ---\n\n    # Next Steps\n\n    To start using this backend:\n\n    1. **Setup the environment variables** (database URL, upload folder, timezone)\n    2. **Install dependencies** using npm\n    3. **Start the server** with npm start\n    4. **Test the APIs** using Postman or similar tool\n    5. **Connect frontend** application to these APIs\n\n    For detailed API endpoint documentation, refer to **API_DOCUMENTATION.md** file.\n\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-10-10T19:07:26.417Z'\n    exportedUsing: Bruno/4.2.1\n";
